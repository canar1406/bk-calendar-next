name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static web app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false

      - name: Verify toolchain
        run: |
          node --version
          test "$(node --version | cut -d. -f1)" = "v24"
          test "$(pnpm --version)" = "11.19.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Derive base path from repository name
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          case "$(printf '%s' "$repository_name" | tr '[:upper:]' '[:lower:]')" in
            *.github.io) base_path="" ;;
            *) base_path="/${repository_name}" ;;
          esac
          printf 'BASE_PATH=%s\n' "$base_path" >> "$GITHUB_ENV"
          printf 'Using BASE_PATH=%q\n' "$base_path"

      - name: Build static SvelteKit site
        run: pnpm --filter @bkalendar-next/web build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/build

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
